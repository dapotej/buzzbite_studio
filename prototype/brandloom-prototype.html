<title>Brandloom Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Buffer-style app shell (ink sidebar + work area), Canva-style canvas-first post screens, editorial page headlines.
   A deliberate single light look; every colour is set explicitly. */
:root {
  color-scheme: light;
  --ink: #111216;          /* sidebar, primary text */
  --paper: #FFFFFF;        /* cards, canvas */
  --desk: #EEF0F3;         /* work area behind posts */
  --line: #D9DDE3;
  --muted: #5C6370;
  --saffron: #FFB020;      /* Brandloom accent */
  --saffron-ink: #7A4D00;
  --ok: #157A44; --ok-bg: #DDF3E6;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  /* Beamer brand kit (used inside posts only) */
  --b-cyan: #00D3F3; --b-black: #080808; --b-off: #F4F1EA; --b-amber: #F5A623; --b-lime: #C6F432; --b-verm: #FF5A1F; --b-pink: #FF4D94;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }

.proto-bar { background: var(--saffron); color: var(--ink); font-size: 13px; font-weight: 600; text-align: center; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100% - 31px); }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* ---------- sidebar ---------- */
.side { background: var(--ink); color: #E9EAEE; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
@media (max-width: 860px) { .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; padding: 0 6px; }
.logo svg { width: 28px; height: 28px; flex: none; }
.side-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8B90A0; padding: 0 8px 6px; }
@media (max-width: 860px) { .side-label, .side-foot { display: none; } }
.brand-pick { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 860px) { .brand-pick { flex-direction: row; } }
.brand-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px; color: #C9CCD6; cursor: pointer; font-weight: 600; }
.brand-btn:hover { background: #1E2027; color: #fff; }
.brand-btn[aria-current="true"] { background: #23262F; color: #fff; }
.brand-dot { width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--b-black); }
.nav { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 860px) { .nav { flex-direction: row; flex-wrap: wrap; margin-left: auto; } }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: #C9CCD6; text-decoration: none; font-weight: 600; }
.nav a:hover { background: #1E2027; color: #fff; }
.nav a[aria-current="page"] { background: var(--saffron); color: var(--ink); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; background: #1A1C22; border-radius: 12px; padding: 12px; font-size: 12.5px; color: #B9BDC8; display: flex; flex-direction: column; gap: 6px; }
.side-foot b { color: #fff; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3DDC84; margin-right: 6px; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }

/* ---------- main ---------- */
.main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 861px) { .main { padding-left: 40px; padding-right: 40px; } }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mega { font-size: clamp(40px, 6vw, 72px); line-height: .95; font-weight: 800; letter-spacing: -0.045em; }
.mega em { font-style: normal; background: var(--saffron); padding: 0 .12em; border-radius: .12em; }
.head { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; justify-content: space-between; }
.sub { color: var(--muted); font-size: 16px; max-width: 60ch; margin-top: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn-ink { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn-ink:hover { background: #2A2D36; }
.btn-sun { background: var(--saffron); border-color: var(--saffron); color: var(--ink); }
.btn-sun:hover { background: #F2A30F; border-color: #F2A30F; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--paper); border-color: var(--line); }
.btn-lg { min-height: 56px; padding: 14px 26px; font-size: 17px; border-radius: 14px; }
.btn svg { width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--desk); color: var(--muted); }
.chip-sun { background: #FFF1D3; color: var(--saffron-ink); }
.chip-ok { background: var(--ok-bg); color: var(--ok); }
.chip-ink { background: var(--ink); color: #fff; }

/* ---------- week ---------- */
.week-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 1000px) { .week-strip { grid-template-columns: minmax(0, 1fr); } }
.slot { background: var(--paper); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; border: 1.5px solid transparent; }
.slot-empty { border: 2px dashed var(--line); background: transparent; min-height: 320px; justify-content: center; align-items: center; text-align: center; color: var(--muted); }
.slot-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.slot-day { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; }
.slot-day small { font-family: var(--text); font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.slot h3 { font-size: 21px; line-height: 1.15; }
.why { font-size: 14px; color: var(--muted); }
.why b { color: var(--ink); }
.src { display: flex; flex-wrap: wrap; gap: 6px; }
.src span { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--desk); color: var(--muted); }
.slot-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.slot.ready { border-color: var(--ok); }

.plan-hero { background: var(--ink); color: #fff; border-radius: 28px; padding: clamp(24px, 4vw, 44px); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; overflow: hidden; position: relative; }
@media (max-width: 900px) { .plan-hero { grid-template-columns: minmax(0, 1fr); } }
.plan-hero h2 { font-size: clamp(30px, 4vw, 48px); line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
.plan-hero p { color: #B9BDC8; font-size: 16px; margin-top: 12px; max-width: 46ch; }
.plan-hero .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.thread { position: absolute; right: -40px; top: -20px; width: 420px; opacity: .9; pointer-events: none; }
@media (max-width: 900px) { .thread { display: none; } }
.steps { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
.step { display: flex; gap: 12px; align-items: center; background: #1B1D24; border-radius: 14px; padding: 12px 14px; font-weight: 600; color: #8B90A0; transition: color .3s, background .3s; }
.step .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3A3E4A; display: grid; place-items: center; flex: none; }
.step.on { color: #fff; }
.step.on .tick { border-color: var(--saffron); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.done { color: #fff; }
.step.done .tick { background: var(--saffron); border-color: var(--saffron); animation: none; }
.step.done .tick::after { content: ""; width: 9px; height: 5px; border-left: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(-45deg) translate(1px, -1px); }
.step small { display: block; font-weight: 500; color: #8B90A0; font-size: 12.5px; }
@keyframes spin { to { transform: rotate(360deg); } }

.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--paper); border-radius: 14px; padding: 10px 16px; font-size: 14px; color: var(--muted); }
.stat b { font-family: var(--display); font-size: 22px; color: var(--ink); margin-right: 6px; font-variant-numeric: tabular-nums; }

/* ---------- post frames ---------- */
.frame { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--b-black); max-width: 100%; }
.frame > .scale { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; }
.vid-badge { position: absolute; z-index: 3; right: 10px; top: 10px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px; }
.vid-badge::before { content: ""; width: 0; height: 0; border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }

/* ---------- picker ---------- */
.picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 900px) { .picker { grid-template-columns: minmax(0, 1fr); max-width: 440px; } }
.option { background: var(--paper); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; border: 2px solid transparent; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s; }
.option:hover { transform: translateY(-3px); border-color: var(--ink); }
.option-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 4px; }
.option-meta h3 { font-size: 18px; }
.option-meta p { font-size: 13px; color: var(--muted); }
.letter { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; flex: none; }

/* ---------- refine ---------- */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 26px; align-items: start; }
@media (max-width: 1000px) { .studio { grid-template-columns: minmax(0, 1fr); } }
.canvas-desk { background: repeating-conic-gradient(#E6E8EC 0% 25%, #EEF0F3 0% 50%) 0 0 / 28px 28px; border-radius: 24px; padding: clamp(16px, 4vw, 44px); display: flex; justify-content: center; }
.canvas-desk .frame { max-width: 500px; box-shadow: 0 24px 60px rgba(17,18,22,.22); }
.panel { background: var(--paper); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 4px; background: var(--desk); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
.msg { padding: 10px 14px; border-radius: 16px; font-size: 14px; max-width: 90%; }
.msg.me { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--desk); border-bottom-left-radius: 4px; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.suggest button:hover { border-color: var(--ink); }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; font: 15px var(--text); padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.caption { white-space: pre-wrap; font-size: 14px; line-height: 1.55; background: var(--desk); border-radius: 14px; padding: 14px; max-height: 260px; overflow-y: auto; }
.channels { display: flex; gap: 8px; align-items: center; }
.ch { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; }
.ch-in { background: #0A66C2; } .ch-ig { background: linear-gradient(45deg, #F58529, #DD2A7B 55%, #8134AF); }
.studio-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* ---------- queue ---------- */
.day-group { display: flex; flex-direction: column; gap: 10px; }
.day-group h2 { font-size: 22px; }
.q-item { background: var(--paper); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 18px; align-items: center; }
@media (max-width: 640px) { .q-item { grid-template-columns: 80px minmax(0, 1fr); } .q-item .q-right { grid-column: 1 / -1; } }
.q-time { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--muted); }
.q-item p { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

/* ---------- library ---------- */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.gen { display: flex; gap: 10px; background: var(--paper); border-radius: 18px; padding: 12px; flex-wrap: wrap; }
.gen input { flex: 1; min-width: 200px; font: 15px var(--text); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); color: var(--ink); background: var(--paper); }

/* ---------- setup wizard ---------- */
.wizard { background: var(--paper); border-radius: 28px; padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px; max-width: 860px; }
.wiz-steps { display: flex; gap: 8px; }
.wiz-steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--desk); }
.wiz-steps span.on { background: var(--ink); }
.paste { width: 100%; min-height: 150px; font: 15px/1.5 var(--text); padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); resize: vertical; color: var(--ink); background: var(--paper); }
.learned { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 700px) { .learned { grid-template-columns: minmax(0, 1fr); } }
.learned > div { background: var(--desk); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.learned h3 { font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--paper); border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600; }
.swatchrow { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.sw i { display: block; width: 72px; height: 72px; border-radius: 16px; border: 1px solid rgba(0,0,0,.08); }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

/* =========================================================
   POST DESIGNS (authored at 1080×1350, Beamer brand kit)
   ========================================================= */
.pd { position: absolute; inset: 0; font-family: "Poppins", sans-serif; overflow: hidden; }
.pd .foot { position: absolute; left: 64px; right: 64px; bottom: 54px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500; }
.bm { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 38px; letter-spacing: -1px; }
.bm i { width: 22px; height: 34px; position: relative; display: inline-block; }
.bm i::before { content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 34px; background: currentColor; border-radius: 2px; }
.bm i::after { content: ""; position: absolute; left: 8px; top: 13px; width: 14px; height: 21px; background: currentColor; border-radius: 0 12px 12px 0; }

/* 1A ticket */
.t1a { background: var(--b-cyan); color: var(--b-black); }
.t1a .tk { position: absolute; left: 64px; right: 64px; top: 120px; height: 860px; background: var(--b-black); color: #fff; border-radius: 36px; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
.t1a .tk::before, .t1a .tk::after { content: ""; position: absolute; width: 72px; height: 72px; border-radius: 50%; background: var(--b-cyan); top: 594px; }
.t1a .tk::before { left: -36px; } .t1a .tk::after { right: -36px; }
.t1a .tk-top { padding: 56px; display: flex; flex-direction: column; gap: 22px; }
.t1a .admit { font-size: 26px; font-weight: 700; letter-spacing: 8px; color: var(--b-cyan); }
.t1a h1 { margin: 0; font-size: 116px; line-height: .95; font-weight: 800; letter-spacing: -4px; }
.t1a .perf { border-top: 6px dashed #2A2A2A; margin: 0 56px; }
.t1a .tk-bot { padding: 40px 56px 50px; display: flex; justify-content: space-between; align-items: center; gap: 30px; }
.t1a .tk-bot div { font-size: 30px; line-height: 1.3; }
.t1a .tk-bot b { display: block; font-size: 40px; color: var(--b-lime); }
.qr { width: 190px; height: 190px; background: #fff; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; flex: none; }
.qr span { background: var(--b-black); border-radius: 2px; }
.qr span.o { background: transparent; }
.t1a .tag { position: absolute; left: 64px; top: 1010px; font-size: 44px; font-weight: 700; line-height: 1.15; max-width: 900px; }

/* 1B night route */
.t1b { background: #05070C; color: #fff; }
.t1b svg.map { position: absolute; inset: 0; }
.t1b .k { position: absolute; left: 64px; top: 64px; font-size: 24px; letter-spacing: 6px; font-weight: 700; color: var(--b-cyan); }
.t1b h1 { position: absolute; left: 64px; right: 64px; bottom: 200px; margin: 0; font-size: 128px; line-height: .95; font-weight: 800; letter-spacing: -4px; }
.t1b h1 span { color: var(--b-cyan); }
.t1b .pin { position: absolute; font-size: 22px; font-weight: 600; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 16px; display: flex; gap: 10px; align-items: center; }
.t1b .pin i { width: 14px; height: 14px; border-radius: 50%; display: block; }

/* 1C poster */
.t1c { background: var(--b-off); color: var(--b-black); }
.t1c .blk { position: absolute; }
.t1c h1 { position: absolute; left: 50px; top: 90px; margin: 0; font-size: 300px; line-height: .8; font-weight: 900; letter-spacing: -16px; }
.t1c .on { position: absolute; left: 64px; top: 820px; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -2px; }
.t1c .on span { background: var(--b-cyan); padding: 0 14px; border-radius: 14px; }
.t1c .small { position: absolute; left: 64px; top: 1030px; font-size: 30px; color: #4A4A4A; max-width: 700px; line-height: 1.35; }

/* 2A receipt */
.t2a { background: var(--b-amber); color: var(--b-black); }
.t2a .rc { position: absolute; left: 170px; right: 170px; top: 70px; height: 1000px; background: #FFFDF7; padding: 52px 50px; font-family: "JetBrains Mono", monospace; box-shadow: 0 30px 60px rgba(0,0,0,.18); }
.t2a .rc::after { content: ""; position: absolute; left: 0; right: 0; bottom: -24px; height: 24px; background: linear-gradient(-45deg, transparent 16px, #FFFDF7 0) 0 0 / 32px 24px, linear-gradient(45deg, transparent 16px, #FFFDF7 0) 0 0 / 32px 24px; }
.t2a .rc h4 { margin: 0 0 6px; font-size: 30px; text-align: center; letter-spacing: 4px; }
.t2a .rc .c { text-align: center; font-size: 20px; color: #6B6B6B; margin-bottom: 26px; }
.t2a .line { display: flex; justify-content: space-between; font-size: 24px; padding: 9px 0; border-bottom: 2px dashed #DDD6C6; }

          </div>
          <div class="steps" id="steps" aria-live="polite">
            ${[["Reading Beamer's brand kit", "Voice, pillars, colours, facts"], ["Searching the web", "Lagos events, airport travel, 2027 media plans"], ["Checking recent posts", "Avoiding repeats from the last 4 weeks"], ["Drafting 3 posts", "Mon, Wed, Fri for LinkedIn and Instagram"]].map(([a, b]) => `<div class="step"><span class="tick"></span><div>${a}<small>${b}</small></div></div>`).join("")}
          </div>
        </section>
        <div class="week-strip">${POSTS.map((p) => `<div class="slot slot-empty"><div><div class="slot-day">${p.day}<small>${p.date}</small></div><p style="margin-top:6px">Empty slot</p></div></div>`).join("")}</div>
      </div>`;
    }
    return `<div class="wrap">
      <div class="head">
        <div><div class="eyebrow">Beamer · Week of 30 November</div><h1 class="mega" style="margin-top:10px">${readyCount === 3 ? "Your week is <em>ready.</em>" : "Here's your <em>week.</em>"}</h1>
        <p class="sub">${readyCount === 3 ? "All three posts are approved and queued for LinkedIn and Instagram." : "Three posts, planned from this week's news and Beamer's pillars. Accept one to pick its design."}</p></div>
        <div class="stats"><div class="stat"><b>3</b>planned</div><div class="stat"><b>${readyCount}</b>ready</div><div class="stat"><b>2</b>channels</div></div>
      </div>
      <div class="week-strip">${POSTS.map((p) => {
        const d = state.chosen[p.id];
        const ready = state.ready[p.id];
        return `<article class="slot ${ready ? "ready" : ""}">
          <div class="slot-top"><span class="slot-day">${p.day}<small>${p.date} · ${p.time}</small></span>${ready ? '<span class="chip chip-ok">Ready</span>' : `<span class="chip ${p.format === "Video" ? "chip-ink" : ""}">${p.format}</span>`}</div>
          ${d ? frame(d) : ""}
          <span class="chip chip-sun" style="align-self:flex-start">${p.pillar}</span>
          <h3>${p.title}</h3>
          ${d ? "" : `<p class="why"><b>Why now:</b> ${p.why}</p><div class="src">${p.sources.map((s) => `<span>${s}</span>`).join("")}</div>`}
          <div class="slot-actions">
            ${ready ? `<button class="btn" type="button" data-refine="${p.id}">Open</button>` : d ? `<button class="btn btn-ink" type="button" data-refine="${p.id}">Continue editing</button>` : `<button class="btn btn-ink" type="button" data-pick="${p.id}">Choose a design</button><button class="btn btn-ghost" type="button" data-swap="${p.id}">Swap idea</button>`}
          </div>
        </article>`;
      }).join("")}</div>
      <p class="sub" style="margin-top:0"><button class="btn btn-ghost" type="button" id="reset">Start the prototype again</button></p>
    </div>`;
  },

  pick(id) {
    const p = POSTS.find((x) => x.id === +id);
    return `<div class="wrap">
      <div class="head"><div><button class="btn btn-ghost" type="button" data-go="week">← This week</button>
        <div class="eyebrow" style="margin-top:14px">${p.day} ${p.date} · ${p.pillar}</div><h1 class="mega" style="margin-top:10px;font-size:clamp(34px,4.6vw,56px)">Pick a <em>direction.</em></h1>
        <p class="sub">Three different designs for “${p.title}”, all in Beamer's colours and type. Choose the one closest to what you want; you can change anything next.</p></div>
        <button class="btn" type="button" id="more">Show 3 more</button></div>
      <div class="picker">${p.designs.map((d, i) => `<button class="option" type="button" data-choose="${p.id}:${d}">${frame(d)}<div class="option-meta"><span class="letter">${"ABC"[i]}</span><div style="flex:1"><h3>${p.names[i][0]}</h3><p>${p.names[i][1]}</p></div></div></button>`).join("")}</div>
    </div>`;
  },

  refine(id) {
    const p = POSTS.find((x) => x.id === +id);
    const d = state.chosen[p.id] || p.designs[0];
    return `<div class="wrap">
      <div class="studio-bar">
        <button class="btn btn-ghost" type="button" data-go="week">← This week</button>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" type="button" data-pick="${p.id}">Other designs</button>
          <button class="btn" type="button" id="download">${p.format === "Video" ? "Download MP4" : "Download PNG"}</button>
          <button class="btn btn-sun" type="button" id="approve" data-id="${p.id}">${state.ready[p.id] ? "Approved" : "Approve and queue"}</button>
        </div>
      </div>
      <div class="studio">
        <div class="canvas-desk">${frame(d)}</div>
        <div class="panel">
          <div><div class="eyebrow">${p.day} ${p.date} · ${p.time}</div><h2 style="font-size:24px;margin-top:6px">${p.title}</h2></div>
          <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="chat">Edit with Claude</button><button role="tab" aria-selected="false" data-tab="caption">Captions</button></div>
          <div id="tab-chat" class="stack" style="display:flex;flex-direction:column;gap:12px">
            <div class="chat" id="chat"><div class="msg ai">This is the ${p.names[p.designs.indexOf(d)]?.[0] ?? "chosen"} design. Tell me what to change, or try one of these.</div></div>
            <div class="suggest">${["Shorter headline", "Make it bolder", "Try the lime accent", "Use a real photo"].map((s) => `<button type="button" data-ask="${s}">${s}</button>`).join("")}</div>
            <form class="composer" id="composer"><input id="ask" type="text" aria-label="Ask Claude to change the post" placeholder="e.g. mention Abuja airport"><button class="btn btn-ink" type="submit">Send</button></form>
          </div>
          <div id="tab-caption" hidden>
            <div class="channels" style="margin-bottom:10px"><span class="ch ch-in" title="LinkedIn">in</span><span class="ch ch-ig" title="Instagram">IG</span><span class="chip" style="margin-left:auto">Captions written for each</span></div>
            <div class="tabs" role="tablist" style="margin-bottom:10px"><button role="tab" aria-selected="true" data-cap="li">LinkedIn</button><button role="tab" aria-selected="false" data-cap="ig">Instagram</button></div>
            <div class="caption" id="caption">${p.li}</div>
          </div>
        </div>
      </div>
    </div>`;
  },

  queue() {
    const items = POSTS.filter((p) => state.ready[p.id]);
    return `<div class="wrap">
      <div><div class="eyebrow">Beamer</div><h1 class="mega" style="margin-top:10px">The <em>queue.</em></h1><p class="sub">Approved posts, in the order they go out. Connect LinkedIn and Instagram to publish automatically, or download and post them yourself.</p></div>
      ${items.length ? POSTS.map((p) => state.ready[p.id] ? `<section class="day-group"><h2>${p.day === "Mon" ? "Monday" : p.day === "Wed" ? "Wednesday" : "Friday"} ${p.date}</h2>
        <div class="q-item"><div style="width:96px">${frame(state.chosen[p.id])}</div><div style="min-width:0"><div class="q-time">${p.time}</div><h3 style="font-size:18px;margin:4px 0">${p.title}</h3><p>${p.li.split("\n")[0]}</p></div>
        <div class="q-right"><div class="channels"><span class="ch ch-in">in</span><span class="ch ch-ig">IG</span></div><button class="btn" type="button" data-refine="${p.id}">Edit</button></div></div></section>` : "").join("")
      : `<div class="slot slot-empty" style="min-height:220px"><div><h3>Nothing queued yet</h3><p style="margin-top:6px">Approve a post on <a href="#week">This week</a> and it lands here.</p></div></div>`}
    </div>`;
  },

  library() {
    const tiles = [["Arrivals hall, Lagos", "t3b"], ["Taxi screen at dusk", "t1b"], ["Lekki at 6pm", "t2b"], ["Play-log receipt", "t2a"]];
    return `<div class="wrap">
      <div><div class="eyebrow">Beamer</div><h1 class="mega" style="margin-top:10px">Photos <em>&amp; clips.</em></h1><p class="sub">Your own footage makes the strongest posts. Upload it here, or describe a picture and Claude makes one in Beamer's art direction.</p></div>
      <form class="gen" onsubmit="event.preventDefault(); toast('In the real app this generates an image in about 20 seconds.')"><input id="gen" type="text" aria-label="Describe an image" placeholder="A taxi with a glowing roof screen on Admiralty Way at dusk"><button class="btn btn-ink" type="submit">Generate</button><button class="btn" type="button" onclick="toast('In the real app this opens your files.')">Upload</button></form>
      <div class="lib">${tiles.map(([n, d]) => `<div class="slot" style="padding:12px;gap:10px">${frame(d)}<b style="font-size:14px">${n}</b></div>`).join("")}</div>
    </div>`;
  },

  setup(step = "1") {
    const s = +step;
    const bar = `<div class="wiz-steps" aria-label="Step ${s} of 3">${[1, 2, 3].map((i) => `<span class="${i <= s ? "on" : ""}"></span>`).join("")}</div>`;
    let body = "";
    if (s === 1) body = `<div><div class="eyebrow">Step 1 of 3</div><h1 class="mega" style="margin-top:10px;font-size:clamp(32px,4vw,52px)">Tell us about the <em>business.</em></h1><p class="sub">Paste a concept note, a pitch deck or your website. Claude does the rest.</p></div>
      <textarea class="paste" id="paste" aria-label="About the business">Beamer is the modern way to buy outdoor advertising in Nigeria: airports and screens on the move, booked in one place, with proof that your ad ran…</textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ink btn-lg" type="button" data-wiz="2">Read it</button><button class="btn btn-lg" type="button" onclick="toast('In the real app you can paste a website address too.')">Use a website instead</button></div>`;
    if (s === 2) body = `<div><div class="eyebrow">Step 2 of 3</div><h1 class="mega" style="margin-top:10px;font-size:clamp(32px,4vw,52px)">Here's what we <em>learned.</em></h1><p class="sub">Click anything to change it. Posts only ever use facts from this page.</p></div>
      <div class="learned">
        <div><h3>Voice</h3><div class="tags"><span>Plain</span><span>Confident</span><span>Specific</span><span>British spelling</span></div></div>
        <div><h3>Audience</h3><div class="tags"><span>Bank &amp; telco brand managers</span><span>Agency planners</span><span>Real-estate sales heads</span></div></div>
        <div><h3>Content pillars</h3><div class="tags"><span>The problem</span><span>Proof</span><span>Inventory</span><span>Timely</span><span>Buyer education</span></div></div>
        <div><h3>Facts posts can use</h3><div class="tags"><span>6 airports</span><span>Every play logged with GPS</span><span>Geo-targeting by hour</span></div></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ink btn-lg" type="button" data-wiz="3">Looks right</button><button class="btn btn-ghost btn-lg" type="button" data-wiz="1">Back</button></div>`;
    if (s === 3) body = `<div><div class="eyebrow">Step 3 of 3</div><h1 class="mega" style="margin-top:10px;font-size:clamp(32px,4vw,52px)">Your <em>look.</em></h1><p class="sub">Taken from your logo and website. Drop in a logo file to replace it.</p></div>
      <div class="swatchrow">${[["#00D3F3", "Lead"], ["#080808", "Dark"], ["#F4F1EA", "Light"], ["#F5A623", "Amber"], ["#C6F432", "Lime"], ["#FF5A1F", "Vermilion"], ["#FF4D94", "Pink"]].map(([c, n]) => `<div class="sw"><i style="background:${c}"></i>${n}</div>`).join("")}</div>
      <div class="learned"><div><h3>Fonts</h3><p style="font-family:Poppins;font-weight:800;font-size:28px">Poppins</p></div><div><h3>Photo style</h3><p class="why">Documentary photography in Lagos and Nigerian airports, real people, evening light, no text in images.</p></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sun btn-lg" type="button" data-go="week">Save and plan my first week</button><button class="btn btn-ghost btn-lg" type="button" data-wiz="2">Back</button></div>`;
    return `<div class="wrap"><section class="wizard">${bar}${body}</section></div>`;
  },
};

// ---------------------------------------------------------------------------
function route() {
  const [name, arg] = (location.hash.slice(1) || "week").split("-");
  const view = views[name] ? name : "week";
  main.innerHTML = views[view](arg);
  document.querySelectorAll(".nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === view || (a.dataset.nav === "week" && (view === "pick" || view === "refine")) ? "page" : "false"));
  requestAnimationFrame(fitFrames);
  window.scrollTo({ top: 0 });
}
const go = (h) => { if (location.hash === "#" + h) route(); else location.hash = h; };
window.addEventListener("hashchange", route);

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  if (t.dataset.pick) go("pick-" + t.dataset.pick);
  if (t.dataset.refine) go("refine-" + t.dataset.refine);
  if (t.dataset.wiz) go("setup-" + t.dataset.wiz);
  if (t.dataset.swap) toast("In the real app Claude proposes a different idea for this slot.");
  if (t.id === "more") toast("In the real app Claude designs three more directions.");
  if (t.id === "reset") { state.planned = false; state.chosen = {}; state.ready = {}; save(); route(); }
  if (t.dataset.choose) { const [id, d] = t.dataset.choose.split(":"); state.chosen[id] = d; save(); go("refine-" + id); }
  if (t.id === "plan-btn") plan(t);
  if (t.id === "approve") { state.ready[t.dataset.id] = true; save(); toast("Approved. Queued for LinkedIn and Instagram."); setTimeout(() => go("week"), 700); }
  if (t.id === "download") toast("In the real app this downloads the finished file.");
  if (t.dataset.tab) {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === t)));
    $("#tab-chat").hidden = t.dataset.tab !== "chat"; $("#tab-caption").hidden = t.dataset.tab !== "caption";
  }
  if (t.dataset.cap) {
    document.querySelectorAll("[data-cap]").forEach((b) => b.setAttribute("aria-selected", String(b === t)));
    const id = (location.hash.split("-")[1]); const p = POSTS.find((x) => x.id === +id); $("#caption").textContent = p[t.dataset.cap];
  }
  if (t.dataset.ask) ask(t.dataset.ask);
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "composer") return;
  e.preventDefault();
  const v = $("#ask").value.trim(); if (!v) return;
  $("#ask").value = ""; ask(v);
});

function ask(text) {
  const chat = $("#chat");
  chat.insertAdjacentHTML("beforeend", `<div class="msg me"></div>`);
  chat.lastElementChild.textContent = text;
  const f = $(".canvas-desk .frame"); const d = f.dataset.design; const pd = f.querySelector(".pd");
  const edits = EDITS[text]?.[d] || EDITS[text]?.["*"];
  setTimeout(() => {
    let reply = "Done. In the real app I'd rewrite the post for that; here's the idea.";
    if (edits) {
      edits.forEach(([sel, val]) => { if (sel === "style") pd.style.cssText += ";" + val; else { const el = pd.querySelector(sel); if (el) el.innerHTML = val; } });
      reply = text === "Make it bolder" ? "Pushed the colour and contrast up." : text === "Try the lime accent" ? "Swapped cyan for Beamer's lime." : "Shortened it.";
    } else if (text === "Use a real photo") reply = "In the real app I'd pick a matching photo from your library, or generate one in Beamer's photo style.";
    chat.insertAdjacentHTML("beforeend", `<div class="msg ai">${reply}</div>`);
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}

function plan(btn) {
  btn.disabled = true; btn.textContent = "Planning…";
  const steps = document.querySelectorAll("#steps .step");
  steps.forEach((s, i) => {
    setTimeout(() => { s.classList.add("on"); }, i * 900);
    setTimeout(() => { s.classList.remove("on"); s.classList.add("done"); }, i * 900 + 850);
  });
  setTimeout(() => { state.planned = true; save(); route(); toast("Three posts planned for this week."); }, steps.length * 900 + 300);
}

route();
</script>
