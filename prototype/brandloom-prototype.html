<title>Brandloom Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Buffer-style shell (light sidebar + calendar-first work area). Calm neutral app so the posts carry the colour.
   One deliberate light look; every colour is set explicitly. */
:root {
  color-scheme: light;
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --sunk: #EDEFF2;
  --line: #E1E4E9;
  --ink: #15171C;
  --muted: #646B78;
  --accent: #2F5BEA;
  --accent-soft: #E8EEFF;
  --ok: #157A44; --ok-soft: #E1F4E9;
  --wait: #9A5B00; --wait-soft: #FFF2DC;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --b-cyan: #00D3F3; --b-black: #080808; --b-off: #F4F1EA; --b-amber: #F5A623; --b-lime: #C6F432; --b-verm: #FF5A1F; --b-pink: #FF4D94;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }

.proto-bar { background: var(--ink); color: #D7DAE0; font-size: 12.5px; text-align: center; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 31px); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
@media (max-width: 900px) { .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.03em; padding: 0 8px; }
.logo svg { width: 26px; height: 26px; }
.brand-switch { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; width: 100%; text-align: left; font-weight: 700; }
.brand-switch small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.bdot { width: 30px; height: 30px; border-radius: 8px; background: var(--b-cyan); color: var(--b-black); display: grid; place-items: center; font-weight: 800; flex: none; }
@media (max-width: 900px) { .brand-switch { width: auto; } .side-foot { display: none; } }
.nav { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 900px) { .nav { flex-direction: row; flex-wrap: wrap; margin-left: auto; } }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: var(--wait-soft); color: var(--wait); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 8px 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.side-foot b { color: var(--ink); }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2DBE6C; margin-right: 6px; }

.main { min-width: 0; padding-block: 26px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 901px) { .main { padding-left: 36px; padding-right: 36px; } }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.title { font-size: clamp(32px, 4.4vw, 48px); line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
.sub { color: var(--muted); font-size: 15.5px; max-width: 62ch; margin-top: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #C5CAD3; background: #FAFBFC; }
.btn-ink { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn-ink:hover { background: #2B2F38; border-color: #2B2F38; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-ok:hover { background: #106338; border-color: #106338; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-lg { min-height: 52px; padding: 12px 22px; font-size: 16px; border-radius: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip-wait { background: var(--wait-soft); color: var(--wait); }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-acc { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; background: var(--sunk); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.pilot { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.pilot-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.days { display: flex; gap: 6px; }
.days button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.mix { display: flex; gap: 6px; flex-wrap: wrap; }
.pilot .spacer { flex: 1; }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; flex-basis: 100%; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.cal-wrap { overflow-x: auto; border-radius: 18px; }
.cal { min-width: 860px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.cal-head, .cal-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 10px 12px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.cell { min-height: 150px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.cal-row .cell:last-child { border-right: 0; }
.cal-row:last-child .cell { border-bottom: 0; }
.cell.out { background: #FAFAFB; }
.cell.out .dnum { color: #B4B9C2; }
.dnum { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell.today .dnum { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 7px; align-self: flex-start; }
.slot-add { flex: 1; border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; color: #A3A9B4; font-size: 12px; font-weight: 600; min-height: 90px; }
.cpost { display: block; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; border-radius: 10px; position: relative; }
.cpost .frame { border-radius: 9px; }
.cpost:hover .frame { outline: 2px solid var(--accent); outline-offset: 2px; }
.cpost .st { position: absolute; left: 6px; top: 6px; z-index: 4; font-size: 10.5px; padding: 2px 7px; }
.week .cell { min-height: 360px; }

.frame { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: #DDE1E7; max-width: 100%; }
.frame > .scale { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; }
.vbadge { position: absolute; z-index: 4; right: 6px; top: 6px; background: rgba(0,0,0,.7); color: #fff; font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
.vbadge::before { content: ""; border-left: 6px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.frame.still .pd * { animation-play-state: paused !important; animation-delay: -2s !important; }

.review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 26px; align-items: start; }
@media (max-width: 1000px) { .review { grid-template-columns: minmax(0, 1fr); } }
.stage { background: var(--sunk); border-radius: 22px; padding: clamp(14px, 3vw, 36px); display: flex; justify-content: center; }
.stage .frame { max-width: 480px; box-shadow: 0 20px 50px rgba(21,23,28,.18); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.caption { white-space: pre-wrap; font-size: 14px; line-height: 1.55; background: var(--bg); border-radius: 12px; padding: 12px 14px; max-height: 230px; overflow-y: auto; }
.ch { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; flex: none; }
.ch-in { background: #0A66C2; } .ch-ig { background: linear-gradient(45deg, #F58529, #DD2A7B 55%, #8134AF); }
.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; font: 15px var(--text); padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); }
.quick button:hover { border-color: var(--ink); }
.reply { font-size: 14px; background: var(--accent-soft); color: #1C3A9C; border-radius: 12px; padding: 10px 12px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; }
.strip button { flex: none; width: 62px; padding: 0; border: 2px solid transparent; border-radius: 10px; background: none; cursor: pointer; position: relative; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip .frame { border-radius: 8px; }
.strip .ok { position: absolute; right: 3px; bottom: 3px; z-index: 5; width: 16px; height: 16px; border-radius: 50%; background: var(--ok); border: 2px solid #fff; }

.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.idea h3 { font-size: 19px; line-height: 1.2; }
.idea p { color: var(--muted); font-size: 14px; }
.idea .src { display: flex; flex-wrap: wrap; gap: 6px; }
.idea .src span { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 2px 8px; }
.idea .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
.idea.added { border-color: var(--ok); }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
@media (max-width: 700px) { .summary { grid-template-columns: minmax(0, 1fr); } }

.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; display: block; }
.tile b { font-size: 13.5px; }
.gen { display: flex; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.gen input { flex: 1; min-width: 220px; font: 15px var(--text); padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

/* ===== POST DESIGNS (1080×1350, Beamer brand kit) ===== */
.pd { position: absolute; inset: 0; font-family: "Poppins", sans-serif; overflow: hidden; }
.pd .foot { position: absolute; left: 64px; right: 64px; bottom: 52px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 500; z-index: 3; }
.bm { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 38px; letter-spacing: -1px; }
.bm i { width: 22px; height: 34px; position: relative; display: inline-block; }
.bm i::before { content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 34px; background: currentColor; border-radius: 2px; }
.bm i::after { content: ""; position: absolute; left: 8px; top: 13px; width: 14px; height: 21px; background: currentColor; border-radius: 0 12px 12px 0; }
.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kick { display: inline-block; font-size: 24px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; padding: 10px 18px; border-radius: 10px; }
.hl { margin: 0; font-weight: 800; letter-spacing: -4px; line-height: .96; }

.d-pb .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 45%, rgba(0,0,0,.86) 100%); }
.d-pb .kick { position: absolute; left: 64px; top: 64px; background: var(--b-cyan); color: var(--b-black); }
.d-pb .hl { position: absolute; left: 64px; right: 64px; bottom: 170px; color: #fff; font-size: 112px; }
.d-pb .hl span { color: var(--b-cyan); }

.d-band { background: var(--b-cyan); }
.d-band .ph { height: 62%; }
.d-band .box { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; padding: 50px 64px; color: var(--b-black); }
.d-band .hl { font-size: 92px; }
.d-band .tag { position: absolute; left: 64px; top: 64px; background: var(--b-black); color: #fff; }

.d-frame { background: var(--b-off); color: var(--b-black); }
.d-frame .hl { position: absolute; left: 64px; right: 64px; top: 70px; font-size: 96px; }
.d-frame .hl span { background: var(--b-cyan); padding: 0 12px; border-radius: 14px; }
.d-frame .ph { position: absolute; left: 64px; right: 64px; top: 330px; bottom: 150px; width: auto; height: auto; border-radius: 32px; }
.d-frame .note { position: absolute; right: 90px; bottom: 180px; background: var(--b-black); color: #fff; font-size: 26px; font-weight: 600; padding: 16px 22px; border-radius: 16px; z-index: 2; }

.d-stat .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%); }
.d-stat .circ { position: absolute; right: 64px; top: 64px; width: 330px; height: 330px; border-radius: 50%; background: var(--b-lime); color: var(--b-black); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.d-stat .circ b { font-size: 120px; line-height: .9; letter-spacing: -5px; }
.d-stat .circ span { font-size: 26px; font-weight: 700; max-width: 220px; line-height: 1.1; }
.d-stat .hl { position: absolute; left: 64px; right: 64px; bottom: 170px; color: #fff; font-size: 100px; }

.d-vid .ph { animation: kb 9s ease-out infinite alternate; transform-origin: 60% 40%; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.14); } }
.d-vid .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.85) 100%); }
.d-vid .lines { position: absolute; left: 64px; right: 64px; bottom: 170px; color: #fff; }
.d-vid .ln { font-size: 108px; font-weight: 800; letter-spacing: -4px; line-height: 1; opacity: 0; animation: up 9s cubic-bezier(.2,.8,.2,1) infinite; }
.d-vid .ln:nth-child(2) { animation-delay: .6s; } .d-vid .ln:nth-child(3) { animation-delay: 1.2s; }
.d-vid .ln span { color: var(--b-cyan); }
@keyframes up { 0% { opacity: 0; transform: translateY(50px); } 8%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.d-vid .live { position: absolute; left: 64px; top: 64px; background: rgba(0,0,0,.55); color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 3px; padding: 10px 18px; border-radius: 10px; display: flex; gap: 12px; align-items: center; }
.d-vid .live i { width: 14px; height: 14px; border-radius: 50%; background: var(--b-pink); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.d-ticket { background: var(--b-cyan); color: var(--b-black); }
.d-ticket .tk { position: absolute; left: 64px; right: 64px; top: 110px; height: 860px; background: var(--b-black); color: #fff; border-radius: 36px; overflow: hidden; }
.d-ticket .tk::before, .d-ticket .tk::after { content: ""; position: absolute; width: 72px; height: 72px; border-radius: 50%; background: var(--b-cyan); top: 594px; }
.d-ticket .tk::before { left: -36px; } .d-ticket .tk::after { right: -36px; }
.d-ticket .top { padding: 56px; display: flex; flex-direction: column; gap: 22px; height: 630px; }
.d-ticket .ad { font-size: 26px; font-weight: 700; letter-spacing: 8px; color: var(--b-cyan); }
.d-ticket .hl { font-size: 116px; }
.d-ticket .perf { border-top: 6px dashed #2A2A2A; margin: 0 56px; }
.d-ticket .bot { padding: 36px 56px; display: flex; justify-content: space-between; align-items: center; font-size: 30px; line-height: 1.3; }
.d-ticket .bot b { display: block; font-size: 40px; color: var(--b-lime); }
.qr { width: 170px; height: 170px; background: #fff; border-radius: 14px; padding: 12px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.qr span { background: var(--b-black); border-radius: 2px; } .qr span.o { background: transparent; }
.d-ticket .tag { position: absolute; left: 64px; top: 1010px; font-size: 44px; font-weight: 700; line-height: 1.15; max-width: 900px; }

.d-receipt { background: var(--b-amber); color: var(--b-black); }
.d-receipt .rc { position: absolute; left: 170px; right: 170px; top: 70px; height: 1000px; background: #FFFDF7; padding: 52px 50px; font-family: "JetBrains Mono", monospace; box-shadow: 0 30px 60px rgba(0,0,0,.18); }
.d-receipt .rc h4 { margin: 0 0 6px; font-size: 30px; text-align: center; letter-spacing: 4px; }
.d-receipt .c { text-align: center; font-size: 20px; color: #6B6B6B; margin-bottom: 26px; }
.d-receipt .ln2 { display: flex; justify-content: space-between; font-size: 24px; padding: 9px 0; border-bottom: 2px dashed #DDD6C6; }
.d-receipt .tot { display: flex; justify-content: space-between; font-size: 34px; font-weight: 700; padding-top: 22px; }
.d-receipt .ex { position: absolute; right: 50px; top: 52px; font-size: 16px; color: #8B8B8B; font-family: "Poppins", sans-serif; }
.d-receipt .hl { position: absolute; left: 64px; right: 64px; top: 1105px; font-size: 80px; text-align: center; letter-spacing: -3px; }

.d-board { background: #0B0C10; color: #fff; }
.d-board .k { position: absolute; left: 64px; top: 70px; font-size: 26px; letter-spacing: 6px; font-weight: 700; color: var(--b-amber); }
.d-board .board { position: absolute; left: 64px; right: 64px; top: 140px; display: flex; flex-direction: column; gap: 10px; }
.d-board .r { display: grid; grid-template-columns: 170px 1fr 250px; gap: 10px; }
.d-board .c { background: #1B1D23; border-radius: 8px; padding: 14px 16px; font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 700; white-space: nowrap; position: relative; overflow: hidden; }
.d-board .c::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #0B0C10; }
.d-board .hd .c { background: transparent; font-size: 20px; color: #8D919C; padding: 6px 16px; }
.d-board .hd .c::after { display: none; }
.d-board .ok { color: var(--b-lime); font-size: 28px; }
.d-board .hl { position: absolute; left: 64px; right: 64px; top: 820px; font-size: 118px; }

const D = {

};

  { d: "vid", img: "crowd", kicker: "DETTY DECEMBER", lines: ["Every show.", "Every route.", "<span>Your brand.</span>"], title: "Detty December: be on the road to every show", li: "December in Lagos runs on events. The crowd is on the road before every show, and that is where your brand can meet them.\n\nEvent Burst puts your event on Beamer Motion taxi-top screens on the routes to the venue, in the hours that matter, with a QR code straight to tickets. Every play is logged with time and GPS location.\n\nPromoting a show this December? Book a planning call at beamerads.com.", ig: "The crowd is on the road before every show. Be there with them.\n\nEvent Burst: Beamer Motion screens across Lagos, timed to the night, with a QR code straight to tickets.\n\n#DettyDecember #Lagos #EventMarketing #DigitalOOH" },

  { d: "vid", img: "taxi", kicker: "BEAMER MOTION", lines: ["Your ad,", "<span>on the move.</span>"], title: "Beamer Motion: your ad on the move", li: "Lagos lives on the road. Beamer Motion puts your brand on GPS-tracked taxi-top screens moving through the city, by area and by hour.\n\nEvery play logged. Every route mapped.\n\nBook a planning call at beamerads.com.", ig: "Your ad, on the move across Lagos.\n\n#BeamerMotion #Lagos #DigitalOOH #OOH" },

  { d: "band", img: "traffic", kicker: "Lagos, 6pm", hl: "The city is on the road. Be there.", title: "Lagos evenings happen on the road", li: "Every evening, Lagos is on the road. Most outdoor still can't tell you where or when your ad was seen.\n\nBeamer Motion screens move with the traffic and log every play.\n\nBook a planning call at beamerads.com.", ig: "The city is on the road. Be there.\n\n#Lagos #DigitalOOH #OOH" },
  { d: "receipt", hl: "Every play, itemised.", title: "Every play, itemised", li: "Imagine getting a receipt for your outdoor campaign. That is what the Beamer play log is: every play, with time and place.\n\nExample shown. Request the media kit at beamerads.com.", ig: "Every play, itemised.\n\n#OOH #MediaPlanning" },
  { d: "stat", img: "office", big: "2027", bigLabel: "plans are being written now", hl: "Plan it with proof.", title: "Planning 2027? Plan it with proof", li: "2027 media plans are being written now. If outdoor is on yours, ask every media owner one question: what proof do I get?\n\nWith Beamer: photos of every airport placement, a play log for every taxi-screen play, audience estimates and response tracking, in one report.\n\nRequest the media kit at beamerads.com.", ig: "2027 plans are being written now. Plan it with proof.\n\n#MediaPlanning #OOH #Nigeria" },
  { d: "ticket", hl: "Be on the road to every show.", note: "Screens on the routes into every December venue.", title: "Event Burst for the holiday shows", li: "The holiday shows put the whole city on the move. Event Burst puts your event on Beamer Motion screens on the routes to the venue, with a QR code straight to tickets.\n\nBook a planning call at beamerads.com.", ig: "Admit your brand to every holiday show.\n\n#Lagos #EventMarketing" },
  { d: "band", img: "airport", kicker: "Home for Christmas", hl: "Welcome them home.", title: "Home for Christmas: arrivals season", li: "This week, families land in Lagos, Abuja and Port Harcourt for Christmas. Airport screens put your brand in the first moment of their trip home.\n\nRequest the media kit at beamerads.com.", ig: "Welcome them home this Christmas.\n\n#Christmas #Lagos #AirportAdvertising" },
  { d: "poster", big: "Merry<br>Xmas", hl: "From all of us<br><span>at Beamer.</span>", note: "Thank you to every brand that moved with us this year.", title: "Merry Christmas from Beamer", li: "Merry Christmas from all of us at Beamer. Thank you to every brand, agency and partner that moved with us this year.", ig: "Merry Christmas from Beamer.\n\n#MerryChristmas #Lagos" },
  { d: "stat", img: "airport", big: "6", bigLabel: "airports, one booking", hl: "Start 2027 where they land.", title: "Start 2027 at arrivals", li: "Start 2027 where your customers land. Six airports, one booking, one report.\n\nRequest the media kit at beamerads.com.", ig: "Start 2027 where they land.\n\n#Nigeria #AirportAdvertising #OOH" },
  { d: "list", kicker: "BUYER'S CHECKLIST", hl: "3 questions to ask any media owner.", items: ["Can you prove it ran?", "Where exactly did it play?", "How is the audience estimated?"], title: "3 questions to ask any media owner", li: "Before you sign an outdoor plan for 2027, ask three questions:\n\n1. Can you prove it ran?\n2. Where exactly did it play?\n3. How is the audience estimated?\n\nBeamer answers all three in every post-campaign report. Request the media kit at beamerads.com.", ig: "3 questions to ask any media owner.\n\n#MediaPlanning #OOH #Marketing" },

const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const TODAY = "2026-11-26";
const state = { days: [0, 2, 4], filled: false, status: {}, view: "month", added: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("bl-proto2") || "{}")); } catch {}
const save = () => { try { localStorage.setItem("bl-proto2", JSON.stringify(state)); } catch {} };
const $ = (s, r = document) => r.querySelector(s);
const main = $("#main");
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2400); }

const iso = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
const fmt = (s, o) => new Date(s + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", ...o });
const dowOf = (s) => (new Date(s + "T00:00:00Z").getUTCDay() + 6) % 7;

function slots() {
  const out = [];
  for (let d = new Date("2026-11-30T00:00:00Z"); iso(d) <= "2026-12-31"; d = addDays(d, 1)) if (state.days.includes(dowOf(iso(d)))) out.push(iso(d));
  return out;
}
const postFor = (date) => { const i = slots().indexOf(date); return i < 0 ? null : { ...POOL[i % POOL.length], date }; };
const toReview = () => (state.filled ? slots().filter((d) => state.status[d] !== "approved") : []);

function frame(p, still = false) {
  return `<div class="frame ${still ? "still" : ""}">${p.d === "vid" ? '<span class="vbadge">Video</span>' : ""}<div class="scale">${D[p.d](p)}</div></div>`;
}
function fitFrames() { document.querySelectorAll(".frame").forEach((f) => { const s = f.querySelector(".scale"); if (s) s.style.transform = `scale(${f.clientWidth / 1080})`; }); }
new ResizeObserver(fitFrames).observe(document.body);

const views = {
  calendar() {
    const n = slots().length, rev = toReview().length;
    const start = new Date("2026-11-30T00:00:00Z");
    const rows = Array.from({ length: state.view === "week" ? 1 : 5 }, (_, w) => Array.from({ length: 7 }, (_, d) => iso(addDays(start, w * 7 + d))));
    return `<div class="wrap">
      <div class="head">
        <div><h1 class="title">December</h1>
          <p class="sub">${state.filled ? `${n} posts are ready for LinkedIn and Instagram. ${rev ? `${rev} are waiting for your OK.` : "All approved."}` : "Choose your posting days. Claude creates the whole month for you: photos, videos and captions, in Beamer's look."}</p></div>
        <div class="row">
          <div class="seg" role="group" aria-label="View"><button type="button" data-view="month" aria-pressed="${state.view === "month"}">Month</button><button type="button" data-view="week" aria-pressed="${state.view === "week"}">Week</button></div>
          ${state.filled && rev ? `<a class="btn btn-ink" href="#review">Review ${rev} posts</a>` : ""}
        </div>
      </div>
      <section class="pilot" aria-label="Posting plan">
        <div><div class="pilot-label">Post on</div><div class="days" role="group" aria-label="Posting days">${DOW.map((d, i) => `<button type="button" data-day="${i}" aria-pressed="${state.days.includes(i)}" aria-label="${d}">${d[0]}</button>`).join("")}</div></div>
        <div><div class="pilot-label">Mix</div><div class="mix"><span class="chip chip-acc">Photos</span><span class="chip chip-acc">Video</span><span class="chip chip-acc">Graphics</span><span class="chip">${state.days.length} a week</span></div></div>
        <span class="spacer"></span>
        ${state.filled ? `<button class="btn" type="button" id="reset">Start the demo again</button>` : `<button class="btn btn-ink btn-lg" type="button" id="fill">Create December's posts</button>`}
        <div class="progress" id="prog" hidden><div></div></div>
      </section>
      <div class="cal-wrap"><div class="cal ${state.view === "week" ? "week" : ""}">
        <div class="cal-head">${DOW.map((d) => `<div>${d}</div>`).join("")}</div>
        ${rows.map((r) => `<div class="cal-row">${r.map((date) => {
          const p = state.filled ? postFor(date) : null;
          const posting = state.days.includes(dowOf(date)) && date <= "2026-12-31";
          const ok = state.status[date] === "approved";
          return `<div class="cell ${date > "2026-12-31" ? "out" : ""} ${date === TODAY ? "today" : ""}">
            <span class="dnum">${fmt(date, { day: "numeric" })}${date === "2026-11-30" || date === "2027-01-01" ? " " + fmt(date, { month: "short" }) : ""}</span>
            ${p ? `<button class="cpost" type="button" data-open="${date}" aria-label="${p.title.replace(/"/g, "")}">${frame(p, true)}<span class="st chip ${ok ? "chip-ok" : "chip-wait"}">${ok ? "Approved" : "To review"}</span></button>` : posting ? `<div class="slot-add">${state.filled ? "" : "Post day"}</div>` : ""}
          </div>`;
        }).join("")}</div>`).join("")}
      </div></div>
    </div>`;
  },

  review(date) {
    const list = state.filled ? slots() : [];
    if (!list.length) return `<div class="wrap"><h1 class="title">Nothing to review yet</h1><p class="sub">Create this month's posts on the <a href="#calendar">calendar</a> first.</p></div>`;
    const pending = toReview();
    const cur = date && list.includes(date) ? date : pending[0] || list[0];
    const p = postFor(cur), approved = state.status[cur] === "approved";
    return `<div class="wrap">
      <div class="head"><div><h1 class="title">${pending.length ? `${pending.length} posts to review` : "Everything's approved"}</h1><p class="sub">Approve each post, or tell Claude what to change. Approved posts go out on their date.</p></div>
        ${pending.length > 1 ? `<button class="btn" type="button" id="approve-all">Approve all ${pending.length}</button>` : ""}</div>
      <div class="strip" aria-label="Posts this month">${list.map((d) => `<button type="button" data-open="${d}" aria-current="${d === cur}" aria-label="${fmt(d, { weekday: "short", day: "numeric", month: "short" })}">${frame(postFor(d), true)}${state.status[d] === "approved" ? '<span class="ok" aria-hidden="true"></span>' : ""}</button>`).join("")}</div>
      <div class="review">
        <div class="stage">${frame(p)}</div>
        <div class="panel">
          <div class="row" style="justify-content:space-between"><span class="chip">${fmt(cur, { weekday: "long", day: "numeric", month: "long" })} · 10:00</span><span class="chip ${approved ? "chip-ok" : "chip-wait"}">${approved ? "Approved" : "To review"}</span></div>
          <h2 style="font-size:23px">${p.title}</h2>
          <div class="row" style="gap:8px"><span class="ch ch-in">in</span><span class="ch ch-ig">IG</span><span class="seg" role="group" aria-label="Caption"><button type="button" data-cap="li" aria-pressed="true">LinkedIn</button><button type="button" data-cap="ig" aria-pressed="false">Instagram</button></span></div>
          <div class="caption" id="caption">${p.li}</div>
          <div class="decide"><button class="btn btn-ok btn-lg" type="button" data-approve="${cur}">${approved ? "Approved" : "Approve"}</button><button class="btn btn-lg" type="button" data-next="${cur}">Next post</button></div>
          <div class="quick">${["New photo", "Make it a video", "Shorter caption", "Different design"].map((q) => `<button type="button" data-q="${q}">${q}</button>`).join("")}</div>
          <form class="ask" id="ask"><input id="ask-in" type="text" aria-label="Ask Claude to change this post" placeholder="Or say what to change…"><button class="btn btn-ink" type="submit">Change</button></form>
          <div id="reply"></div>
        </div>
      </div>
    </div>`;
  },

  ideas() {
    return `<div class="wrap">
      <div class="head"><div><h1 class="title">Trend radar</h1><p class="sub">Ideas from what's happening for Beamer's audience right now, checked this morning. Add one to the calendar and Claude creates the post.</p></div>
        <button class="btn" type="button" id="recheck">Check again</button></div>
      <section class="summary"><p><b>This week:</b> December events, diaspora arrivals and 2027 budget planning dominate. Proof of delivery is the topic marketers engage with most.</p><span class="chip">Updated today, 07:00</span></section>
      <div class="ideas">${IDEAS.map((x, i) => `<article class="idea ${state.added[i] ? "added" : ""}">
        <div class="row" style="gap:6px"><span class="chip ${x.urg === "This week" ? "chip-wait" : ""}">${x.urg}</span><span class="chip">${x.fmt}</span></div>
        <h3>${x.t}</h3><p>${x.why}</p>
        <div class="src">${x.src.map((s) => `<span>${s}</span>`).join("")}</div>
        <div class="foot">${state.added[i] ? `<span class="chip chip-ok">Added to ${state.added[i]}</span>` : `<button class="btn btn-ink" type="button" data-add="${i}">Add to calendar</button>`}</div>
      </article>`).join("")}</div>
    </div>`;
  },

  library() {
    const tiles = [["airport", "Arrivals hall, evening"], ["taxi", "Taxi screen at dusk"], ["crowd", "December concert crowd"], ["office", "Reviewing a campaign report"], ["traffic", "Lagos traffic at golden hour"]];
    return `<div class="wrap">
      <div class="head"><div><h1 class="title">Photos &amp; video</h1><p class="sub">Everything Claude uses in posts. Upload your own photos and clips, or describe what you need. Any photo can become a short video.</p></div></div>
      <form class="gen" id="gen"><input id="gen-in" type="text" aria-label="Describe a photo" placeholder="A taxi with a glowing roof screen on Admiralty Way at night"><button class="btn btn-ink" type="submit">Create photo</button><button class="btn" type="button" data-toast="In the real app this opens your files.">Upload</button></form>
      <div class="lib">${tiles.map(([k, n]) => `<div class="tile"><img src="${IMG[k]}" alt="${n}"><b>${n}</b><div class="row" style="gap:6px"><span class="chip">AI photo</span><button class="btn btn-ghost" type="button" style="min-height:32px;padding:4px 8px" data-toast="In the real app this turns the photo into a 5-second clip.">Make video</button></div></div>`).join("")}</div>
    </div>`;
  },

  brand() {
    return `<div class="wrap">
      <div class="head"><div><h1 class="title">Brand kit</h1><p class="sub">Read from Beamer's concept note and website. Every post follows this. Click anything to change it.</p></div></div>
      <div class="ideas">
        <article class="idea"><h3>Colours</h3><div class="row">${["#00D3F3","#080808","#F4F1EA","#F5A623","#C6F432","#FF5A1F","#FF4D94"].map((c) => `<span style="width:40px;height:40px;border-radius:10px;background:${c};border:1px solid #0001"></span>`).join("")}</div></article>
        <article class="idea"><h3>Voice</h3><p>Plain, confident, specific. British spelling. No hype, no exclamation marks.</p></article>
        <article class="idea"><h3>Audience</h3><p>Brand managers at banks, telcos and premium brands; agency planners; real-estate sales heads.</p></article>
        <article class="idea"><h3>Content pillars</h3><div class="row" style="gap:6px">${["The problem", "Proof", "Inventory", "Timely", "Buyer education"].map((x) => `<span class="chip">${x}</span>`).join("")}</div></article>
        <article class="idea"><h3>Photo style</h3><p>Documentary photography in Lagos and Nigerian airports. Evening light, real people, no text in images.</p></article>
        <article class="idea"><h3>Facts posts can use</h3><p>Six airports · every play logged with GPS · geo-targeting by hour · post-campaign report as standard.</p></article>
      </div>
    </div>`;
  },
};

function route() {
  const [name, arg] = (location.hash.slice(1) || "calendar").split("~");
  const v = views[name] ? name : "calendar";
  main.innerHTML = views[v](arg);
  document.querySelectorAll(".nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === v ? "page" : "false"));
  const c = toReview().length, nc = $("#nav-count"); nc.hidden = !c; nc.textContent = c;
  requestAnimationFrame(fitFrames);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });

function fill(btn) {
  btn.disabled = true;
  const prog = $("#prog"), bar = prog.firstElementChild; prog.hidden = false;
  const steps = ["Reading Beamer's brand kit", "Checking this week's news and events", "Creating photos and videos", "Designing each post", "Writing captions"];
  let i = 0;
  const tick = setInterval(() => {
    btn.textContent = steps[Math.min(i, steps.length - 1)] + "…";
    bar.style.width = `${Math.min(100, (i + 1) * 20)}%`;
    if (++i > steps.length) { clearInterval(tick); state.filled = true; state.status = {}; save(); route(); toast(`${slots().length} posts created. Review them when you're ready.`); }
  }, 650);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.id === "brand-switch") toast("In the real app this switches brand or adds a new one.");
  if (t.id === "recheck") toast("In the real app Claude searches the web again (about 2 minutes).");
  if (t.dataset.view) { state.view = t.dataset.view; save(); route(); }
  if (t.dataset.day !== undefined) {
    const d = +t.dataset.day; state.days = state.days.includes(d) ? state.days.filter((x) => x !== d) : [...state.days, d].sort();
    if (!state.days.length) state.days = [d];
    save(); route(); if (state.filled) toast("Posting days changed. Claude fills the new days automatically.");
  }
  if (t.id === "fill") fill(t);
  if (t.id === "reset") { state.filled = false; state.status = {}; state.added = {}; save(); route(); }
  if (t.dataset.open) location.hash = "review~" + t.dataset.open;
  if (t.dataset.approve) { state.status[t.dataset.approve] = "approved"; save(); const next = toReview()[0]; toast("Approved."); if (next) location.hash = "review~" + next; else route(); }
  if (t.dataset.next) { const l = slots(); location.hash = "review~" + l[(l.indexOf(t.dataset.next) + 1) % l.length]; }
  if (t.id === "approve-all") { slots().forEach((d) => (state.status[d] = "approved")); save(); route(); toast("All posts approved. They go out on their dates."); }
  if (t.dataset.cap) {
    document.querySelectorAll("[data-cap]").forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
    const d = location.hash.split("~")[1] || toReview()[0] || slots()[0]; $("#caption").textContent = postFor(d)[t.dataset.cap];
  }
  if (t.dataset.q) reply(t.dataset.q);
  if (t.dataset.add !== undefined) {
    const free = ["Thu 3 Dec", "Tue 8 Dec", "Thu 10 Dec", "Tue 15 Dec", "Thu 17 Dec", "Tue 22 Dec", "Tue 29 Dec", "Thu 31 Dec"];
    const used = Object.values(state.added); state.added[t.dataset.add] = free.find((f) => !used.includes(f)) || "Thu 31 Dec"; save(); route();
    toast(`Added. Claude is creating the post for ${state.added[t.dataset.add]}.`);
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "gen") toast("In the real app this makes the photo in about 20 seconds.");
  if (e.target.id === "ask") { const v = $("#ask-in").value.trim(); if (v) { reply(v); $("#ask-in").value = ""; } }
});
function reply(q) {
  const r = { "New photo": "In the real app I'd create a new photo in Beamer's style and rebuild the post around it.", "Make it a video": "In the real app I'd animate the photo into a 5-second clip with moving headlines.", "Shorter caption": "In the real app I'd cut the caption to about 40 words and keep the call to action.", "Different design": "In the real app I'd redesign this post in a different layout with the same message." }[q] || `Got it: “${q}”. In the real app I'd update the post and show you the new version.`;
  $("#reply").innerHTML = '<div class="reply"></div>'; $("#reply .reply").textContent = r;
}
route();
</script>
